name: Release notes

# Builds the client release notes when a release tag (e.g. v1.5.0) is pushed:
#   - Content: the tickets done between the previous release tag and this one, one row per ticket.
#   - Sections: New Features, Bug Fixes, Improvements, picked from the PR's labels first, then its title or branch prefix
#     (feat/ → New Features, fix/ → Bug Fixes).
#   - Left out: technical PRs (chore, ci, build, test, refactor, docs, dependencies) and PRs labelled
#     skip-release-notes or ignore-for-release. Use one of these labels for internal work with a feat/fix prefix.
#   - Unclear PRs (labels, title and branch say nothing) go to Improvements and are flagged in the "For the team" table.
# Uploads release-notes-<tag>.md as a workflow artifact and shows it in the run summary, followed by a
# "For the team" table that shows where each PR went. It also commits the file to docs/release-notes/ on the
# release-notes branch, where the release-note-email skill reads it. That branch only holds release notes: it is never
# merged into main and nobody pushes to it by hand. The workflow doesn't touch main or create the GitHub release.
#
# Tickets can live in any tracker. Set these repository variables (Settings > Secrets and variables > Actions > Variables):
#   TICKET_PATTERN  Regex for ticket IDs in PR titles, branch names and descriptions. With a capture group, the group is the ID.
#   TICKET_URL      Link to one ticket; {id} is replaced by the ID. Leave empty to show IDs without links.
#   Jira:   TICKET_PATTERN = \b(?:PROJ|OPS)-\d+\b    TICKET_URL = https://acme.atlassian.net/browse/{id}
#   Trello: TICKET_PATTERN = trello\.com/c/(\w+)     TICKET_URL = https://trello.com/c/{id}
#   Not set: the tickets are the GitHub issues each PR closes ("Closes #12") or mentions ("Refs #12").
#
# Run it by hand (Actions > Release notes > Run workflow) to rebuild the notes for an existing tag.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the notes for, e.g. v1.5.0
        required: true
        type: string
      previous_tag:
        description: Previous release tag. Leave empty to find it from the tag history.
        required: false
        type: string

# One run per tag; pushing the same tag again (delete + re-push) cancels the run that is still going.
concurrency:
  group: release-notes-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write # read the history; push the notes to the release-notes branch
  pull-requests: read
  issues: read

jobs:
  release-notes:
    name: Build release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history and all tags, to find the previous tag and the commits in between

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build release notes
        id: notes
        env:
          # Inputs go through env, never straight into the script, so a tag name can't inject shell code.
          TAG: ${{ inputs.tag || github.ref_name }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TICKET_PATTERN: ${{ vars.TICKET_PATTERN }}
          TICKET_URL: ${{ vars.TICKET_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: release-notes
        run: node .github/scripts/release-notes.mjs

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.notes.outputs.artifact_name }}
          path: release-notes/
          if-no-files-found: error
          retention-days: 90

      - name: Save release notes to the release-notes branch
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          FILE_NAME: ${{ steps.notes.outputs.artifact_name }}.md
          BRANCH: release-notes
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/release-notes-branch"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch holds only docs/release-notes/. Create it (with no history) on the first release.
          # Full ref: a bare "release-notes" would also match refs/heads/feat/release-notes.
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch --no-tags origin "$BRANCH"
            git worktree add --detach "$worktree" FETCH_HEAD
            cd "$worktree"
          else
            git worktree add --detach "$worktree"
            cd "$worktree"
            git checkout --quiet --orphan "$BRANCH"
            git rm -r -f -q .
          fi

          mkdir -p docs/release-notes
          cp "$GITHUB_WORKSPACE/release-notes/$FILE_NAME" "docs/release-notes/$FILE_NAME"
          git add docs/release-notes
          if git diff --cached --quiet; then
            echo "docs/release-notes/$FILE_NAME is unchanged on $BRANCH"
            exit 0
          fi
          git commit --quiet -m "docs(release-notes): save release notes for $TAG"

          # Two tags released at the same time can race: rebase on the other run's commit and retry.
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase --no-tags origin "$BRANCH"
          done
          echo "Saved docs/release-notes/$FILE_NAME on $BRANCH"
