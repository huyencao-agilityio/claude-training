<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="app-header">
      <h1>Task Tracker</h1>
      <!-- "Alice (user)": the logged-in user's name and role -->
      <span id="current-user" class="muted"></span>
    </header>

    <!-- Both start hidden: app.js shows one once GET /auth/me answers, so no task data flashes -->
    <section id="login-screen" class="card" hidden>
      <h2>Log in</h2>
      <!-- novalidate: empty fields are marked by app.js with "Required" (AC1.5) -->
      <form id="login-form" class="stacked" novalidate>
        <label class="field">
          <span>Email</span>
          <input name="email" type="text" autocomplete="username" />
          <small class="field-error" hidden>Required</small>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" />
          <small class="field-error" hidden>Required</small>
        </label>
        <button type="submit" id="login-btn">Log in</button>
      </form>
      <p id="login-message" class="message error"></p>
    </section>

    <div id="app" hidden>
    <!-- Admin only (AC4.2); app.js shows it after login. Also the Edit form (AC4.6). -->
    <section id="task-form-card" class="card" hidden>
      <h2 id="task-form-heading">New task</h2>
      <form id="new-task-form" class="stacked">
        <label class="field">
          <span>Title</span>
          <input name="title" placeholder="e.g. Write release notes" required maxlength="200" />
        </label>
        <label class="field">
          <span>Description <small class="muted">(optional)</small></span>
          <textarea name="description" rows="3" placeholder="Add more details"></textarea>
        </label>
        <label class="field">
          <span>Due date</span>
          <input name="dueDate" type="date" />
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="cancel-edit-btn" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="form-message" class="message"></p>
    </section>

    <section class="card">
      <form id="filter-form" class="filters">
        <input name="search" placeholder="Search by title" />
        <select name="status">
          <option value="">All statuses</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <button type="submit">Search</button>
      </form>
      <p id="count" class="muted"></p>
      <!-- "Saved" or the error after a change in a row, for 5 seconds (AC4.4, AC4.5, AC4.8) -->
      <p id="list-message" class="message" role="status"></p>
      <table>
        <thead>
          <tr><th>Title</th><th>Status</th><th>Due date</th><th></th><th id="actions-header" hidden>Actions</th></tr>
        </thead>
        <tbody id="task-rows"></tbody>
      </table>
      <nav class="pager">
        <button type="button" id="prev-page">Previous</button>
        <span id="page-info" class="muted"></span>
        <button type="button" id="next-page">Next</button>
      </nav>
    </section>
    </div>

    <!-- AC4.7: the button's value becomes the dialog's returnValue -->
    <dialog id="delete-dialog">
      <form method="dialog">
        <p id="delete-text"></p>
        <div class="form-actions">
          <button value="delete" class="danger">Delete</button>
          <button value="cancel" class="secondary">Cancel</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
