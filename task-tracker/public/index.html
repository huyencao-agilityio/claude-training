<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Task Tracker</h1>

    <section class="card">
      <h2>New task</h2>
      <form id="new-task-form" class="stacked">
        <label class="field">
          <span>Title</span>
          <input name="title" placeholder="e.g. Write release notes" required maxlength="200" />
        </label>
        <label class="field">
          <span>Description <small class="muted">(optional)</small></span>
          <textarea name="description" rows="3" placeholder="Add more details"></textarea>
        </label>
        <label class="field">
          <span>Due date</span>
          <input name="dueDate" type="date" />
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <button type="submit" id="save-btn">Save</button>
      </form>
      <p id="form-message" class="message"></p>
    </section>

    <section class="card">
      <form id="filter-form" class="filters">
        <input name="search" placeholder="Search by title" />
        <select name="status">
          <option value="">All statuses</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <button type="submit">Search</button>
      </form>
      <p id="count" class="muted"></p>
      <table>
        <thead>
          <tr><th>Title</th><th>Status</th><th>Due date</th><th></th></tr>
        </thead>
        <tbody id="task-rows"></tbody>
      </table>
      <nav class="pager">
        <button type="button" id="prev-page">Previous</button>
        <span id="page-info" class="muted"></span>
        <button type="button" id="next-page">Next</button>
      </nav>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
